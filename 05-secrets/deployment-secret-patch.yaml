# deployment-secret-patch.yaml
# Purpose: strategic-merge patch for the demo Deployment that mounts the synced
# Secret as read-only files. Files beat environment variables: they update when the
# Secret rotates and they do not leak into process listings or crash dumps.
spec:
  template:
    spec:
      containers:
        - name: demo
          volumeMounts:
            - name: db-credentials
              mountPath: /etc/demo-secrets
              readOnly: true
      volumes:
        - name: db-credentials
          secret:
            secretName: demo-db
            defaultMode: 0440
