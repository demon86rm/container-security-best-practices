# secretstore-vault.yaml
# Purpose: SecretStore for HashiCorp Vault (KV v2), the usual backend when the
# cluster runs on-premises and there is no cloud secret manager. NOT exercised in
# the workshop cluster.
# Authentication: Vault's Kubernetes auth method. Vault validates the ServiceAccount
# token below against the cluster, so no long-lived Vault token is stored in the
# cluster. On the Vault side, create a role "demo-app" bound to this ServiceAccount
# and namespace, with a policy that reads only secret/data/demo/*.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
  labels:
    app.kubernetes.io/part-of: demo-app
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/part-of: demo-app
spec:
  provider:
    vault:
      server: https://<your-vault-host>:8200
      path: secret          # KV v2 mount name
      version: v2
      # Private CA for the Vault certificate, if any (ConfigMap with key ca.crt):
      # caProvider:
      #   type: ConfigMap
      #   name: vault-ca
      #   key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: demo-app
          serviceAccountRef:
            name: vault-reader
