# secretstore-azurekv.yaml
# Purpose: SecretStore for Azure Key Vault, for organizations that keep secrets
# in Azure while the workload runs on ROSA (AWS). NOT exercised in the workshop cluster.
# Cross-cloud trade-off: the cluster must hold an Azure credential (below), which is
# itself a secret to protect and rotate. Prefer workload identity federation where
# your Azure tenant allows it (authType: WorkloadIdentity).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-key-vault
  labels:
    app.kubernetes.io/part-of: demo-app
spec:
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: https://<your-vault-name>.vault.azure.net
      tenantId: <your-tenant-id>
      authSecretRef:
        clientId:
          name: azure-sp-credentials
          key: client-id
        clientSecret:
          name: azure-sp-credentials
          key: client-secret
