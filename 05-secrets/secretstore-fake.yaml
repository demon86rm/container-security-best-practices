# secretstore-fake.yaml
# Purpose: workshop-only SecretStore that needs no cloud account. The "fake"
# provider serves the values written below, so the whole ExternalSecret flow can
# be run anywhere. NEVER put real secrets here: this file is plain text in Git.
# In production use secretstore-aws.yaml or secretstore-azurekv.yaml instead.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: workshop-store
  labels:
    app.kubernetes.io/part-of: demo-app
spec:
  provider:
    fake:
      data:
        - key: /demo/db-password
          value: "initial-password-v1"
