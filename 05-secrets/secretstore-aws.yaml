# secretstore-aws.yaml
# Purpose: SecretStore for AWS Secrets Manager. Native choice on ROSA: the pod's
# ServiceAccount is exchanged for an IAM role (IRSA / STS), so no long-lived AWS keys
# are stored in the cluster. NOT exercised in the workshop cluster.
# Replace the role ARN and region. The IAM role needs secretsmanager:GetSecretValue
# on the specific secrets only (least privilege, DORA Art. 9).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: demo-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: eso-aws   # ServiceAccount annotated with eks.amazonaws.com/role-arn
