# externalsecret.yaml
# Purpose: declare WHICH secret the application needs, and from which store. The
# operator fetches it and keeps a native Kubernetes Secret ("demo-db") in sync.
# This file contains no secret value, so it is safe in Git and in code review.
# For Azure Key Vault change the store name to azure-key-vault and the remoteRef key
# to the vault secret name. For AWS use the Secrets Manager secret name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-db
  labels:
    app.kubernetes.io/part-of: demo-app
spec:
  refreshInterval: 15s   # short for the demo; typically 1h in production
  secretStoreRef:
    kind: SecretStore
    name: workshop-store
  target:
    name: demo-db
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /demo/db-password
