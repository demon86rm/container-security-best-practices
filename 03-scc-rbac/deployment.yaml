# deployment.yaml
# Purpose: secure deployment of demo-app. Non-root image, two replicas for
# availability, probes for the platform to rely on, resource requests and limits,
# and a hardened container security context.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
    app.kubernetes.io/part-of: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
        app.kubernetes.io/part-of: demo-app
    spec:
      # No API access needed by this app: do not mount a ServiceAccount token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: ${DEMO_SECURE_IMAGE}
          ports:
            - containerPort: 8080
          env:
            # 12-Factor: config in the environment, injected by the platform.
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: production
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]