# rolebinding.yaml
# Purpose: bind the read-only demo-viewer Role to the demo-limited ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-limited-viewer
  labels:
    app.kubernetes.io/part-of: demo-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-viewer
subjects:
  - kind: ServiceAccount
    name: demo-limited
    namespace: ${PROJECT}